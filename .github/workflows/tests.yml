name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tickora
          POSTGRES_PASSWORD: tickora
          POSTGRES_DB: tickora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tickora -d tickora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: tickora_test
      DB_USERNAME: tickora
      DB_PASSWORD: tickora
      # The test suite uses array cache and sync queues, so Redis is not
      # needed here; setup still must not try to reach it.
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, intl, pcntl, posix, gd, exif
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      # Each check is its own step and runs even if an earlier one failed,
      # so one push reports every problem at once.

      - name: Frontend lint and format
        if: ${{ !cancelled() }}
        run: npm run check

      - name: Frontend type check
        if: ${{ !cancelled() }}
        run: npm run types:check

      - name: Code style (Pint)
        if: ${{ !cancelled() }}
        run: vendor/bin/pint --parallel --test

      - name: Static analysis (PHPStan)
        if: ${{ !cancelled() }}
        # GitHub shows at most 10 annotations per step, so on failure the
        # full report is also emitted as one annotation.
        run: |
          if vendor/bin/phpstan analyse --no-progress --memory-limit=1G --error-format=raw > phpstan.txt 2>&1; then
            cat phpstan.txt
          else
            cat phpstan.txt
            report=$(head -c 60000 phpstan.txt | python3 -c "import sys; print(sys.stdin.read().replace('%','%25').replace('\r','').replace('\n','%0A'))")
            echo "::error title=PHPStan report::${report}"
            exit 1
          fi

      - name: Tests (PHPUnit on PostgreSQL)
        if: ${{ !cancelled() }}
        run: |
          php artisan config:clear --ansi
          php artisan test --log-junit junit.xml

      # Tickora runs on PostgreSQL in production, but local setups often use
      # SQLite. Everything except the PostgreSQL-specific tests (constraints,
      # triggers, row locks) must work there too.
      - name: Tests (SQLite compatibility)
        if: ${{ !cancelled() }}
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan test --exclude-group=postgres --log-junit junit-sqlite.xml

      - name: Report failing tests
        if: ${{ failure() && hashFiles('junit*.xml') != '' }}
        shell: python3 {0}
        run: |
          import os
          import xml.etree.ElementTree as ET

          def escape(text):
              return text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")

          failures = []
          for path, label in (("junit.xml", "PostgreSQL"), ("junit-sqlite.xml", "SQLite")):
              if not os.path.exists(path):
                  continue
              for case in ET.parse(path).iter("testcase"):
                  for kind in ("failure", "error"):
                      node = case.find(kind)
                      if node is not None:
                          text = (node.text or node.get("message") or "").strip()
                          failures.append((f"[{label}] {case.get('class', '')}::{case.get('name', '')}", text))

          # GitHub keeps only 10 annotations per step: one summary of every
          # failure first, then details for the first few.
          summary = "\n\n".join(f"{title}\n{text[:700]}" for title, text in failures)
          print(f"::error title={len(failures)} failing tests::{escape(summary[:60000])}")
          for title, text in failures[:8]:
              print(f"::error title={title}::{escape(text[:1500])}")
