name: mobile

# Builds the Tickora Android app (mobile/) and publishes the APK as a
# GitHub release. The Android project is generated by `flutter create` and
# adjusted by mobile/tool/prepare_android.py, so it always matches the
# Flutter version used here.

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate the Android project
        run: |
          flutter create --org com.tickora --project-name tickora --platforms android .
          rm -f test/widget_test.dart
          python3 tool/prepare_android.py

      - name: Install packages
        run: flutter pub get

      - name: App icon
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      # Tester builds are signed with the key in mobile/signing so each new
      # APK installs over the last. Set the TICKORA_KEYSTORE_BASE64 secret
      # (and its passwords) to sign with a private key instead.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.TICKORA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TICKORA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TICKORA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TICKORA_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "TICKORA_KEYSTORE=$RUNNER_TEMP/release.jks"
              echo "TICKORA_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "TICKORA_KEY_ALIAS=$KEY_ALIAS"
              echo "TICKORA_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            {
              echo "TICKORA_KEYSTORE=$GITHUB_WORKSPACE/mobile/signing/testers.jks"
              echo "TICKORA_KEYSTORE_PASSWORD=tickora-testers"
              echo "TICKORA_KEY_ALIAS=tickora-testers"
              echo "TICKORA_KEY_PASSWORD=tickora-testers"
            } >> "$GITHUB_ENV"
          fi

      - name: Build APK
        run: |
          flutter build apk --release \
            --build-name=0.1.${{ github.run_number }} \
            --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk tickora-android.apk
          ls -la tickora-android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: tickora-android-0.1.${{ github.run_number }}
          path: mobile/tickora-android.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: android-v0.1.${{ github.run_number }}
          name: Tickora for Android 0.1.${{ github.run_number }} (test build)
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: mobile/tickora-android.apk
          body: |
            Test build of the Tickora buyer app.

            **Install:** download `tickora-android.apk` on an Android phone,
            open it, and allow installing from your browser when asked.
            Then enter the address of the Tickora server you were given.

            Built from ${{ github.sha }}.
